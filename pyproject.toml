[project]
name = "fwc-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "fwc-capture", "fwc-drivers", "fwc-plugins"]

[tool.uv.workspace]
members = ["capture", "drivers", "plugins"]

[tool.uv.sources]
fwc-capture = { workspace = true }
fwc-drivers = { workspace = true }
fwc-plugins = { workspace = true }

[tool.ruff]
target-version = "py311"
