[project]
name = "fwc-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "jsonschema>=4.18",
    "markdown>=3.7,<4",
    "openapi-spec-validator>=0.7,<0.9",
    "pillow>=10.1",
    "fwc-capture",
    "fwc-drivers",
    "fwc-iio",
    "fwc-waveshare",
    "fwc-plugins",
]

[tool.uv.workspace]
members = ["capture", "drivers", "drivers/packages/*", "plugins"]

[tool.uv.sources]
fwc-capture = { workspace = true }
fwc-drivers = { workspace = true }
fwc-iio = { workspace = true }
fwc-waveshare = { workspace = true }
fwc-plugins = { workspace = true }

[tool.ruff]
target-version = "py311"
