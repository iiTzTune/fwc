name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
      - run: just rust
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install plugin runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2
      - run: just python
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: just image
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - name: Install guest boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-efi-amd64-bin gdisk mtools dosfstools ovmf qemu-system-x86 linux-image-generic
          kernel=$(find /boot -name 'vmlinuz-*' | sort -V | tail -1)
          sudo install -m 644 "$kernel" "$RUNNER_TEMP/fwc-kernel"
          echo "FWC_TEST_KERNEL=$RUNNER_TEMP/fwc-kernel" >> "$GITHUB_ENV"
      - run: just image-ab-test
