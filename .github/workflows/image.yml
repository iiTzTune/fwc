name: Device image
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - name: Install build and guest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2 grub-efi-amd64-bin gdisk mtools dosfstools e2fsprogs ovmf qemu-system-x86 zstd
      - run: just board-image
      - name: Record image digests
        working-directory: build/image
        run: sha256sum fwc-x86_64.img fwc-slot.ext4 > SHA256SUMS
      - name: Compare with an earlier successful run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh run list --workflow image.yml --commit "$(git rev-parse HEAD)" --status success --limit 30 --json databaseId --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId" | head -1)
          if test -n "$prior"; then
            gh run download "$prior" --name image-digests --dir "$RUNNER_TEMP/prior-image"
            diff -u "$RUNNER_TEMP/prior-image/SHA256SUMS" build/image/SHA256SUMS
            echo "Image digests match run $prior" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "First successful build of this commit supplies the comparison digest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: build/image/SHA256SUMS
          if-no-files-found: error
      - name: Compress flash and update artifacts
        working-directory: build/image
        run: zstd -T0 -3 fwc-x86_64.img fwc-slot.ext4
      - uses: actions/upload-artifact@v4
        with:
          name: fwc-x86_64
          path: |
            build/image/*.zst
            build/image/SHA256SUMS
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
