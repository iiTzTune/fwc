[project]
name = "fwc-plugins"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fwc-drivers==0.1.0", "fwc-capture==0.1.0"]

[tool.uv.sources]
fwc-drivers = { workspace = true }
fwc-capture = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fwc.plugins"
