[project]
name = "fwc-drivers-waveshare144lcd"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fwc-capture==0.1.0", "fwc-drivers==0.1.0", "pillow>=10.1"]


[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fwc.waveshare144lcd"

[project.entry-points."fwc.drivers.display"]
waveshare144lcd = "fwc.waveshare144lcd:Display"

[project.entry-points."fwc.drivers.input"]
waveshare144lcd = "fwc.waveshare144lcd:Input"
