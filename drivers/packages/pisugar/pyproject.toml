[project]
name = "fwc-drivers-pisugar"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fwc-drivers==0.1.0"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fwc.pisugar"

[project.entry-points."fwc.drivers.power"]
pisugar-s = "fwc.pisugar:Power"
