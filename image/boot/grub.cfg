serial --unit=0 --speed=115200
terminal_output console serial
search --no-floppy --label --set=esp FWC-BOOT
regexp --set=1:drive '^(.*),gpt1$' "$esp"
set envfile="($esp)/EFI/FWC/grubenv"
set confirmed=
set pending=
load_env --file "$envfile" confirmed pending
if [ "$confirmed" != A -a "$confirmed" != B ]; then
    set pending=
    load_env --file "($esp)/EFI/FWC/grubenv.safe" confirmed
fi
if [ "$confirmed" != B ]; then set confirmed=A; fi

function boot_slot {
    if [ "$1" = B ]; then
        set root=$drive,gpt3
        set rootid=d4277f77-3392-4fbe-9b37-ea8216000003
    else
        set root=$drive,gpt2
        set rootid=d4277f77-3392-4fbe-9b37-ea8216000002
    fi
    echo "Starting FWC slot $1 (trial=$2)"
    if linux /boot/vmlinuz root=PARTUUID=$rootid ro rootwait panic=5 fwc.slot=$1 fwc.trial=$2 console=tty0 console=ttyS0,115200; then
        if initrd /boot/initrd; then boot; fi
    fi
}

if [ "$pending" = A -o "$pending" = B ]; then
    set candidate=$pending
    set pending=
    if save_env --file "$envfile" pending; then
        if [ "$candidate" != "$confirmed" ]; then boot_slot "$candidate" 1; fi
    fi
fi
boot_slot "$confirmed" 0
echo "The confirmed slot could not load"
sleep 5
reboot
